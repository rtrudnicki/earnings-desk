<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Notes</title><meta name="robots" content="noindex"><style>
:root{color-scheme:light dark;--bg:#fff;--ink:#111;--muted:#666;--rule:#ccc;--row:#f4f4f4;--up:#157a3b;--down:#b22;--link:#0645ad}
@media (prefers-color-scheme:dark){:root{--bg:#121212;--ink:#e8e8e8;--muted:#9a9a9a;--rule:#3a3a3a;--row:#1e1e1e;--up:#5ccf85;--down:#f08a7e;--link:#8ab4f8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
padding:16px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:1100px;margin:0 auto}h1{font-size:22px;margin:0 0 2px}h2{font-size:18px;margin:28px 0 8px;border-bottom:1px solid var(--rule);padding-bottom:4px}
h3{font-size:14px;margin:16px 0 6px}p{margin:4px 0}.muted{color:var(--muted);font-size:13px}a{color:var(--link)}
.tw{overflow-x:auto;border:1px solid var(--rule)}table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}th{font-weight:600;white-space:nowrap}
tr.day td{background:var(--row);font-weight:600}td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--up);font-weight:600}.down{color:var(--down);font-weight:600}.note{margin:18px 0 26px}
ul,ol{margin:4px 0 8px 20px;padding:0}li{margin:2px 0}.two{display:flex;gap:24px;flex-wrap:wrap}.two>div{flex:1 1 240px;min-width:0}
@media (max-width:640px){body{font-size:14px}table{min-width:560px}}

nav{display:flex;gap:18px;align-items:baseline;border-bottom:2px solid var(--ink);padding:10px 0 8px;margin-bottom:6px}
nav b{font-size:17px}nav a{text-decoration:none;color:var(--ink);padding:2px 0}nav a.on{border-bottom:2px solid var(--ink)}
.snap{display:flex;flex-wrap:wrap;gap:8px 18px;margin:8px 0 2px}.snap span{white-space:nowrap;font-variant-numeric:tabular-nums}
.snap b{font-weight:600}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:10px 0}
.card{border:1px solid var(--rule);padding:10px 12px;min-width:0}.card h3{margin:0 0 6px}
.bias{display:inline-block;padding:1px 8px;border:1px solid var(--rule);border-radius:4px;font-weight:600}
.chart{margin:6px 0 10px}.chart svg{max-width:100%;height:auto}svg text{fill:var(--ink);font-size:11px;font-family:inherit}
svg .m{fill:var(--muted)}svg .grid{stroke:var(--rule)}td.c{text-align:center}
input.filter{font:inherit;padding:6px 8px;border:1px solid var(--rule);border-radius:4px;width:100%;max-width:320px;margin:6px 0 10px;background:var(--bg);color:var(--ink)}
</style></head><body><div class="wrap"><nav><b>Earnings notes</b><a href="../index.html" class="">Today</a><a href="../week.html" class="">This week</a><a href="../notes/index.html" class="on">Notes</a></nav><h1>Notes</h1><p class="muted">0 prints on file. Type a ticker or company to filter.</p><input id="f" class="filter" type="search" placeholder="Filter by ticker" aria-label="Filter by ticker"><div class="tw"><table><tr><th>Name</th><th>Quarter</th><th>Call date</th><th>Author</th><th>Status</th><th>EPS</th><th>Gaps</th></tr><tr><td colspan=7>No notes yet.</td></tr></table></div><script>
(function(){var i=document.getElementById('f'),rows=document.querySelectorAll('tr[data-t]');
i.addEventListener('input',function(){var q=i.value.trim().toUpperCase();rows.forEach(function(r){r.hidden=q&&r.dataset.t.indexOf(q)<0;});});})();
</script><p class="muted" style="margin-top:36px">Rebuilt Mon Oct 19, 2:28 AM. Edit the sheet or your doc; the site follows within half an hour.</p></div></body></html>
